<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="musicplayerstyle.css" />
  </head>
  <body>
    <div id="music-player">
      <img id="song-image" src="./kiss.PNG"/>
      <div id="song-name">Song</div>
      <div id="song-artist">Artist</div>

      <input id="slider-song" type="range">

      <div id="music-buttons">
        <i id="shuffle-song" class="fa-solid fa-shuffle"></i>
        <i id="prev-song" class="fa-solid fa-backward-step fa-2x"></i>
        <i id="playpause-song" class="fa-solid fa-circle-play fa-3x"></i>
        <i id="next-song" class="fa-solid fa-forward-step fa-2x"></i>
        <i id="repeat-song" class="fa-solid fa-repeat"></i>
      </div>
    </div>
    <script src="music-player.js"></script>
  </body>
</html>
