<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&display=swap" rel="stylesheet">

  <body>
  <div class="header">
    <div class=pixelify-sans-pixelText><h2>Lich's Cave</h2></div>
  </div>
  <style>
    .grow-image {
      height: auto;
      /* Smoothly animates the growth over 0.3 seconds */
      transition: transform 0.3s ease; 
    }

    /* Target the image only when hovered */
    .grow-image:hover {
      /* Scales the image to 1.2 times its original size */
      transform: scale(1.2); 
    }
  </style>

  <!--Center card, On going project ect-->
  <div class="row">
    <div class="leftcolumn">
      <div class="card">
        <h2>ON GOING PROJECT</h2>
        <h2>Fakemon game</h2>
        <h5>Starting town creation, Aug 8, 2026</h5>
        <img src=".\assets\images\TOWNCROP.PNG" alt="The Starters" class="border">
        <p>Some text..</p>
      </div>
      <div class="card">
        <h2>Further updates coming...</h2>
        <h5>Title description, Sep 2, 2017</h5>
        <div class="border" style="height:200px;">Image</div>
        <p>Some text..</p>
      </div>
    </div>
    <!--Right hand-side card, about me ect-->
    <div class="rightcolumn">
      <div class="card">
        <h2>About Me</h2>
        <img src=".\assets\images\pfp.jpg" style="height:12vw;"></div>
        <p>I like to making things and teach myself new skills in my free time.</p>
    </div>
    <div class="card">
      <h2>The Starters</h2>
        <div class="centered">
            <img src=".\assets\images\KIWI.png" alt="Kiwi Starter"style="height:100px;" class="grow-image">
            <img src=".\assets\images\SHEEP.png" alt="Sheep Starter"style="height:100px;" class="grow-image">
            <img src=".\assets\images\EEL.png" alt="Eel Starter"style="height:90px;" class="grow-image">
        </div>
    </div>
    <div class="card">
      <h3>Follow Me</h3>
      <p>Some text..</p>
    </div>
  </div>


  <div class="footer">
    <h2>Footer</h2>
  </div>
